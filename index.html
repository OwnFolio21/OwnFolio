const TYPES = {

const todayStr = () => {
  const d = new Date();
  const local = new Date(d.getTime() - d.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
};

function isValidDate(value) {
  if (typeof value !== "string" ||
      !/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
  const d = new Date(value + "T00:00:00Z");
  return Number.isFinite(d.getTime()) &&
    d.toISOString().slice(0, 10) === value;
}

function fmtINR(n) {
  if (n === null || n === undefined || !Number.isFinite(Number(n))) return "—";
  const value = Number(n);
  const formatted = Math.abs(value).toLocaleString("en-IN", {
    minimumFractionDigits: 2,
    maximumFractionDigits: 2
  });
  return (value < 0 ? "-₹" : "₹") + formatted;
}

function fmtPct(n) {
  if (n === null || n === undefined || !Number.isFinite(n)) return "—";
  return (n >= 0 ? "+" : "") + (n * 100).toFixed(2) + "%";
}

function fmtDate(d) {
  if (!d || !isValidDate(d)) return "Not recorded";
  return new Date(d + "T00:00:00").toLocaleDateString("en-GB", {
    day: "2-digit", month: "short", year: "numeric"
  });
}

function daysBetween(a, b) {
  return (b.getTime() - a.getTime()) / 86400000;
}

function xnpv(rate, flows, t0) {
  if (!Number.isFinite(rate) || rate <= -1) return NaN;
  return flows.reduce((total, f) => {
    const years = daysBetween(t0, f.date) / 365;
    return total + f.amount / Math.pow(1 + rate, years);
  }, 0);
}

// Change #3: preserve bisection but validate inputs and verify the root.
function xirr(flows) {
  if (!Array.isArray(flows) || flows.length < 2) return null;

  if (!flows.every(f =>
    f.date instanceof Date &&
    Number.isFinite(f.date.getTime()) &&
    Number.isFinite(f.amount)
  )) return null;

  if (!flows.some(f => f.amount < 0) ||
      !flows.some(f => f.amount > 0)) return null;

  const t0 = new Date(Math.min(...flows.map(f => f.date.getTime())));
  let low = -0.9999;
  let high = 10;
  let fLow = xnpv(low, flows, t0);
  let fHigh = xnpv(high, flows, t0);

  if (!Number.isFinite(fLow) || !Number.isFinite(fHigh)) return null;

  let tries = 0;
  while (Math.sign(fLow) === Math.sign(fHigh) && tries < 100) {
    high = high * 1.5 + 0.5;
    fHigh = xnpv(high, flows, t0);
    tries++;
    if (!Number.isFinite(fHigh)) return null;
  }

  if (Math.sign(fLow) === Math.sign(fHigh)) return null;

  let mid = null;
  for (let i = 0; i < 250; i++) {
    mid = (low + high) / 2;
    const fMid = xnpv(mid, flows, t0);
    if (!Number.isFinite(fMid)) return null;
    if (Math.abs(fMid) < 1e-7) break;

    if (Math.sign(fLow) !== Math.sign(fMid)) {
      high = mid;
      fHigh = fMid;
    } else {
      low = mid;
      fLow = fMid;
    }
  }

  const finalNpv = xnpv(mid, flows, t0);
  const scale = flows.reduce((sum, f) => sum + Math.abs(f.amount), 0);

  if (!Number.isFinite(mid) || !Number.isFinite(finalNpv) ||
      Math.abs(finalNpv) > Math.max(1e-5, scale * 1e-10)) return null;

  return mid;
}

// Calculation engine.
function computeEngine(entries, hurdleRate) {
  const sorted = [...entries]
    .filter(e => isValidDate(e.date))
    .sort((a, b) =>
      a.date === b.date
        ? (Number(a.createdAt) || 0) - (Number(b.createdAt) || 0)
        : a.date.localeCompare(b.date)
    );

  // Change #2: valuation date comes only from actual valuation records.
  const valuations = sorted.filter(e =>
    e.type === "valuation" &&
    e.valuation !== "" &&
    e.valuation !== null &&
    e.valuation !== undefined &&
    Number.isFinite(Number(e.valuation)) &&
    Number(e.valuation) >= 0
  );

  const latestValuation = valuations.length
    ? valuations[valuations.length - 1]
    : null;

  const currentValuation = latestValuation
    ? Number(latestValuation.valuation)
    : 0;

  const valuationDate = latestValuation ? latestValuation.date : null;

  const txns = sorted.filter(e =>
    Object.prototype.hasOwnProperty.call(TYPES, e.type) &&
    Number.isFinite(Number(e.amount)) &&
    Number(e.amount) > 0
  );

  const latestTransactionDate = txns.reduce(
    (latest, e) => !latest || e.date > latest ? e.date : latest,
    null
  );

  const irrEndDate = [valuationDate, latestTransactionDate]
    .filter(Boolean)
    .sort()
    .at(-1) || null;

  const endDateObj = irrEndDate
    ? new Date(irrEndDate + "T00:00:00")
    : null;

  const cfRows = txns.map(e => {
    const amount = Number(e.amount);
    const cf = TYPES[e.type].sign * amount;
    const dateObj = new Date(e.date + "T00:00:00");
    const days = endDateObj ? daysBetween(dateObj, endDateObj) : 0;
    const hurdleCF = e.type === "dividend" ? 0 : -cf;
    const hurdleContribution = endDateObj
      ? hurdleCF * (Math.pow(1 + hurdleRate, days / 365) - 1)
      : 0;
    return { ...e, amount, cf, dateObj, days, hurdleContribution };
  });

  const totalInvestments = cfRows
    .filter(r => r.type === "investment")
    .reduce((a, r) => a + r.amount, 0);

  const totalDivestments = cfRows
    .filter(r => r.type === "divestment")
    .reduce((a, r) => a + r.amount, 0);

  const totalDividends = cfRows
    .filter(r => r.type === "dividend")
    .reduce((a, r) => a + r.amount, 0);

  const netCapitalInvested = totalInvestments - totalDivestments;
  const actualGain = currentValuation + totalDivestments +
    totalDividends - totalInvestments;

  const absoluteReturn = netCapitalInvested !== 0
    ? actualGain / netCapitalInvested
    : null;

  const hurdleReturn = cfRows.reduce(
    (a, r) => a + r.hurdleContribution, 0
  );

  const hurdleValue = netCapitalInvested + hurdleReturn;

  // Change #1: dividends count in hurdle comparison, not broker valuation.
  const aboveHurdle = currentValuation + totalDividends - hurdleValue;

  const flows = cfRows.map(r => ({
    date: r.dateObj,
    amount: r.cf
  }));

  // Use the carried-forward last known valuation on the XIRR end date.
  if (endDateObj && valuations.length) {
    flows.push({ date: endDateObj, amount: currentValuation });
  }

  const irr = flows.length >= 2 ? xirr(flows) : null;

  // Change #4: historical chart uses actual valuation entries only.
  const historicalValuations = valuations.map(e => ({
  id: e.id,
  type: "valuation",
  date: e.date,
  valuation: Number(e.valuation)
}));

  const processed = sorted.map(e => ({
    ...e,
    effectiveValuation: currentValuation,
    effectiveValuationDate: valuationDate
  }));

  return {
    processed, cfRows, currentValuation, valuationDate, irrEndDate,
    historicalValuations, totalInvestments, totalDivestments,
    totalDividends, netCapitalInvested, actualGain, absoluteReturn,
    hurdleReturn, hurdleValue, aboveHurdle, irr
  };
}
function AuthScreen() {
  const [mode, setMode] = useState("login");
  const [email, setEmail] = useState("");
  const [pw, setPw] = useState("");
  const [err, setErr] = useState(null);
  const [busy, setBusy] = useState(false);
  const [resetSent, setResetSent] = useState(false);

  const submit = async () => {
    setErr(null);
    setBusy(true);
    try {
      if (mode === "login") {
        await signInWithEmailAndPassword(auth, email, pw);
      } else if (mode === "signup") {
        await createUserWithEmailAndPassword(auth, email, pw);
      } else {
        await sendPasswordResetEmail(auth, email);
        setResetSent(true);
      }
    } catch (e) {
      setErr(e.message.replace("Firebase: ", ""));
    } finally {
      setBusy(false);
    }
  };

  return (
    <div style={{
      background: C.bg, minHeight: "100vh", display: "flex",
      alignItems: "center", justifyContent: "center"
    }}>
      <div style={{ width: "100%", maxWidth: "360px", padding: "24px" }}>
        <div style={{
          fontFamily: "'Sora',sans-serif", color: C.text,
          fontSize: "26px", fontWeight: 800
        }}>IRR Tracker</div>

          {mode === "login" ? "Log in to your ledger" :
           mode === "signup" ? "Create your account" : "Reset your password"}
        </div>

        {mode === "reset" && resetSent ? (
          <p style={{ color: C.pos }}>
            Check your inbox for the password reset link.
          </p>
        ) : (
          <>
            <input
              type="email" placeholder="Email" value={email}
              onChange={e => setEmail(e.target.value)}
              style={inputStyle}
            />
            {mode !== "reset" && (
              <input
                type="password" placeholder="Password" value={pw}
                onChange={e => setPw(e.target.value)}

              />
            )}
            {err && <p style={{ color: C.neg, fontSize: "12px" }}>{err}</p>}
            <button onClick={submit} disabled={busy} style={primaryButton}>
              {busy ? "Please wait…" :
               mode === "login" ? "Log In" :
               mode === "signup" ? "Sign Up" : "Send Reset Link"}
            </button>
          </>
        )}

        {mode === "login" && (
          <button style={textButton} onClick={() => {
            setMode("reset"); setErr(null); setResetSent(false);
          }}>Forgot password?</button>
        )}
        <button style={textButton} onClick={() => {
          setMode(mode === "login" ? "signup" : "login");
          setErr(null); setResetSent(false);
        }}>
          {mode === "signup" || mode === "reset"
            ? "Back to log in" : "New here? Create an account"}

}

const inputStyle = {
  background: C.card, color: C.text, border: `1px solid ${C.divider}`,
  borderRadius: "10px", padding: "12px", width: "100%",

};

const primaryButton = {
  background: C.gold, color: C.bg, border: "none",
  borderRadius: "10px", padding: "13px", width: "100%",
  fontWeight: 700, fontSize: "15px", marginTop: "8px"

  background: "none", border: "none", color: C.sub,

};

function MainApp({ user }) {
  const [entries, setEntries] = useState([]);
  const [hurdleRate, setHurdleRate] = useState(0.075);
  const [view, setView] = useState("dashboard");
  const [modal, setModal] = useState(null);
  const [filterType, setFilterType] = useState("all");
  const [sortDesc, setSortDesc] = useState(true);

  useEffect(() => {
    const entriesCol = collection(db, "users", user.uid, "entries");
    const unsubE = onSnapshot(entriesCol, snap => {
      setEntries(snap.docs.map(d => ({ id: d.id, ...d.data() })));
    }, err => alert("Unable to load entries: " + err.message));

    const settingsRef = doc(db, "users", user.uid, "settings", "config");
    const unsubS = onSnapshot(settingsRef, snap => {
      if (snap.exists() && snap.data().hurdleRate != null) {
        setHurdleRate(snap.data().hurdleRate);
      }
    });

    return () => { unsubE(); unsubS(); };
  }, [user.uid]);

  // Change #5: validate before saving, including edits.
  const saveEntry = async entry => {
    try {
      const allowedTypes = ["investment", "divestment", "dividend", "valuation"];

      if (!allowedTypes.includes(entry.type)) {
        throw new Error("Invalid transaction type.");
      }
      if (!isValidDate(entry.date)) {
        throw new Error("Please enter a valid transaction date.");
      }

      if (entry.type === "valuation") {
        const v = Number(entry.valuation);
        if (entry.valuation === "" || entry.valuation == null ||
            !Number.isFinite(v) || v < 0) {
          throw new Error("Enter a valid valuation of zero or more.");
        }
        entry = { ...entry, valuation: v, amount: 0 };
      } else {
        const amount = Number(entry.amount);
        if (entry.amount === "" || entry.amount == null ||
            !Number.isFinite(amount) || amount <= 0) {
          throw new Error("Transaction amount must be greater than zero.");
        }
        entry = { ...entry, amount };
      }

      const { id, ...data } = entry;
      if (id) {
        await updateDoc(doc(db, "users", user.uid, "entries", id), data);
      } else {
        await addDoc(collection(db, "users", user.uid, "entries"), {
          ...data, createdAt: Date.now()
        });
      }
      setModal(null);
    } catch (e) {
      alert(e.message || "Unable to save transaction.");
    }
  };

  // Change #6: ask before deleting; close modal only after success.
  const deleteEntry = async id => {
    if (!window.confirm(
      "Are you sure you want to delete this transaction? This action cannot be undone."
    )) return false;

    try {
      await deleteDoc(doc(db, "users", user.uid, "entries", id));
      return true;
    } catch (e) {
      alert("Unable to delete transaction: " + e.message);
      return false;
    }
  };

  const persistHurdle = async rate => {
    if (!Number.isFinite(rate) || rate < 0 || rate > 100) {
      alert("Enter a valid hurdle rate between 0% and 100%.");
      return;
    }
    await setDoc(
      doc(db, "users", user.uid, "settings", "config"),
      { hurdleRate: rate },
      { merge: true }
    );
    setHurdleRate(rate);
  };

  const resetAll = async () => {
    if (!window.confirm(
      "Delete ALL transactions and reset settings? This cannot be undone."
    )) return;
    try {
      for (const e of entries) {
        await deleteDoc(doc(db, "users", user.uid, "entries", e.id));
      }
      await persistHurdle(0.075);
    } catch (e) {
      alert("Unable to clear all data: " + e.message);
    }
  };

  const metrics = useMemo(
    () => computeEngine(entries, hurdleRate),
    [entries, hurdleRate]
  );

  return (
    <div style={{
      background: C.bg, minHeight: "100vh",
      fontFamily: "'Inter',sans-serif", color: C.text
    }}>
      <div style={{
        maxWidth: "480px", margin: "0 auto",
        position: "relative", minHeight: "100vh"
      }}>
        <div style={{ paddingBottom: "88px" }}>
          {view === "dashboard" && <Dashboard metrics={metrics} hurdleRate={hurdleRate} />}

          {view === "history" && (
            <HistoryView
              rows={metrics.cfRows}
              filterType={filterType}
              setFilterType={setFilterType}
              sortDesc={sortDesc}
              setSortDesc={setSortDesc}
              onEdit={e => setModal({ entry: e })}
              onDelete={deleteEntry}
            />
          )}

          {view === "settings" && (
            <SettingsView
              hurdleRate={hurdleRate}
              setHurdleRate={persistHurdle}
              onUpdateValuation={(valuation, date) =>
                saveEntry({
                  type: "valuation", amount: 0, valuation, date
                })
              }
              onReset={resetAll}
              currentValuation={metrics.currentValuation}
              valuationDate={metrics.valuationDate}
              userEmail={user.email}
            />
          )}
        </div>

        <button
          onClick={() => setModal({ entry: null })}
          style={{
            background: C.gold, position: "fixed", bottom: "84px",
            right: "24px", width: "56px", height: "56px",
            borderRadius: "50%", border: "none", fontSize: "28px",
            fontWeight: 700, boxShadow: "0 8px 24px #0006", zIndex: 10
          }}
        >+</button>

        <div style={{
          background: C.card, borderTop: `1px solid ${C.divider}`,
          position: "fixed", bottom: 0, left: 0, right: 0,
          maxWidth: "480px", margin: "0 auto", display: "flex", zIndex: 9
        }}>
          <NavBtn label="Dashboard" active={view === "dashboard"} onClick={() => setView("dashboard")} />
          <NavBtn label="History" active={view === "history"} onClick={() => setView("history")} />
          <NavBtn label="Settings" active={view === "settings"} onClick={() => setView("settings")} />
        </div>
      </div>

      {modal && (
        <TransactionModal
          initial={modal.entry}
          onSave={saveEntry}
          onClose={() => setModal(null)}
          onDelete={modal.entry ? async () => {
            const deleted = await deleteEntry(modal.entry.id);
            if (deleted) setModal(null);
          } : null}
        />
      )}
    </div>
  );
}

function NavBtn({ label, active, onClick }) {
  return (
    <button onClick={onClick} style={{
      flex: 1, padding: "14px 0", background: "none",
      border: "none", color: active ? C.gold : C.faint,
      fontSize: "11px", fontWeight: 700
    }}>{label}</button>
  );
}

function ValuationChart({ entries }) {
  const points = [...entries]
    .filter(e => e.type === "valuation" &&
      e.valuation !== "" && e.valuation != null &&
      Number.isFinite(Number(e.valuation)) && Number(e.valuation) >= 0)
    .sort((a, b) => a.date.localeCompare(b.date));

  if (points.length < 2) {
    return (
      <div style={{
        color: C.sub, fontSize: "12px",
        padding: "20px 4px", textAlign: "center"
      }}>
        Record at least two valuations to see historical portfolio value.
      </div>
    );
  }

  const values = points.map(p => Number(p.valuation));
  const min = Math.min(...values);
  const max = Math.max(...values);
  const range = max - min || 1;
  const w = 300, h = 80, pad = 5;
  const coords = values.map((v, i) => ({
    x: pad + (i / (values.length - 1)) * (w - 2 * pad),
    y: h - pad - ((v - min) / range) * (h - 2 * pad)
  }));

  return (
    <div>
      <svg viewBox={`0 0 ${w} ${h}`} width="100%" height="80"
        role="img" aria-label="Historical portfolio valuation">
        <polyline
          points={coords.map(p => `${p.x},${p.y}`).join(" ")}
          fill="none" stroke={C.gold} strokeWidth="2.5"
          strokeLinecap="round" strokeLinejoin="round"
        />
        {coords.map((p, i) => (
          <circle key={points[i].id || i} cx={p.x} cy={p.y}
            r="3" fill={C.gold} />
        ))}
      </svg>
      <div style={{
        display: "flex", justifyContent: "space-between",
        color: C.sub, fontSize: "10px"
      }}>
        <span>{fmtDate(points[0].date)}</span>
        <span>{fmtDate(points[points.length - 1].date)}</span>
      </div>
    </div>
  );
}

function Dashboard({ metrics, hurdleRate }) {
  return (
    <div style={{ padding: "32px 20px 0" }}>
      <div style={{
        color: C.sub, letterSpacing: "0.08em", fontSize: "12px",
        fontWeight: 600, textTransform: "uppercase", marginBottom: "4px"
      }}>Current Valuation</div>

      <div style={{
        fontFamily: "'Sora',sans-serif", fontSize: "36px",
        fontWeight: 800, marginBottom: "4px"
      }}>{fmtINR(metrics.currentValuation)}</div>

      <div style={{ color: C.faint, fontSize: "12px", marginBottom: "12px" }}>
        {metrics.valuationDate
          ? `Last valuation: ${fmtDate(metrics.valuationDate)}`
          : "No valuation recorded yet"}
        {metrics.irrEndDate && metrics.irrEndDate !== metrics.valuationDate
          ? ` · XIRR through ${fmtDate(metrics.irrEndDate)}` : ""}
      </div>

      <div style={{
        background: C.card, borderRadius: "16px",
        padding: "12px", marginBottom: "24px"
      }}>
        <ValuationChart entries={metrics.historicalValuations} />
      </div>

      <div style={{
        display: "grid", gridTemplateColumns: "1fr 1fr",
        gap: "12px", marginBottom: "24px"
      }}>
        <HeroCard label="XIRR" value={fmtPct(metrics.irr)} accent={C.gold} />
        <HeroCard label="Absolute Return" value={fmtPct(metrics.absoluteReturn)}
          accent={metrics.absoluteReturn == null ? C.sub :
            metrics.absoluteReturn >= 0 ? C.pos : C.neg} />
        <HeroCard label="Actual Gain" value={fmtINR(metrics.actualGain)}
          accent={metrics.actualGain >= 0 ? C.pos : C.neg} />
        <HeroCard label="Net Invested" value={fmtINR(metrics.netCapitalInvested)} accent={C.text} />
      </div>

      <div style={{
        background: C.card, borderRadius: "16px",
        overflow: "hidden", marginBottom: "24px"
      }}>
        <DetailRow label="Hurdle Rate" value={(hurdleRate * 100).toFixed(2) + "%"} />
        <DetailRow label="Minimum Required Value" value={fmtINR(metrics.hurdleValue)} />
        <DetailRow
          label={metrics.aboveHurdle >= 0 ? "Above Hurdle" : "Below Hurdle"}
          value={fmtINR(metrics.aboveHurdle)}
          valueColor={metrics.aboveHurdle >= 0 ? C.pos : C.neg}
        />
        <DetailRow label="Total Dividends" value={fmtINR(metrics.totalDividends)} last />
      </div>

      <div style={{
        background: C.card, borderRadius: "16px",
        overflow: "hidden", marginBottom: "24px"
      }}>
        <DetailRow label="Total Investments" value={fmtINR(metrics.totalInvestments)} />
        <DetailRow label="Total Divestments" value={fmtINR(metrics.totalDivestments)} last />
      </div>
    </div>
  );
}

function HeroCard({ label, value, accent }) {
  return (
    <div style={{ background: C.card, borderRadius: "16px", padding: "16px" }}>
      <div style={{
        color: C.sub, fontSize: "11px", fontWeight: 700,
        textTransform: "uppercase", letterSpacing: "0.04em",
        marginBottom: "8px"
      }}>{label}</div>
      <div style={{
        fontFamily: "'Sora',sans-serif", color: accent,
        fontSize: "20px", fontWeight: 700, overflowWrap: "anywhere"
      }}>{value}</div>
    </div>
  );
}

function DetailRow({ label, value, valueColor, last }) {
  return (
    <div style={{
      borderBottom: last ? "none" : `1px solid ${C.divider}`,
      display: "flex", justifyContent: "space-between",
      gap: "12px", padding: "14px 16px"
    }}>
      <div style={{ color: C.sub, fontSize: "14px" }}>{label}</div>
      <div style={{
        color: valueColor || C.text, fontFamily: "'Sora',sans-serif",
        fontSize: "14px", fontWeight: 700, textAlign: "right"
      }}>{value}</div>
    </div>
  );
}

function HistoryView({
  rows, filterType, setFilterType, sortDesc, setSortDesc,
  onEdit, onDelete
}) {
  const filtered = rows
    .filter(r => filterType === "all" || r.type === filterType)
    .sort((a, b) => sortDesc
      ? b.date.localeCompare(a.date)
      : a.date.localeCompare(b.date));

  return (
    <div style={{ padding: "32px 20px 0" }}>
      <div style={{
        fontFamily: "'Sora',sans-serif", fontSize: "24px",
        fontWeight: 800, marginBottom: "16px"
      }}>Transaction History</div>

      <div style={{ display: "flex", gap: "8px", marginBottom: "16px" }}>
        <select value={filterType} onChange={e => setFilterType(e.target.value)}
          style={{
            background: C.card, color: C.text, border: `1px solid ${C.divider}`,
            borderRadius: "8px", padding: "8px 12px", fontSize: "14px", flex: 1
          }}>
          <option value="all">All Types</option>
          <option value="investment">Investment</option>
          <option value="divestment">Divestment</option>
          <option value="dividend">Dividend</option>
        </select>
        <button onClick={() => setSortDesc(!sortDesc)} style={{
          background: C.card, border: `1px solid ${C.divider}`,
          color: C.sub, borderRadius: "8px", padding: "8px 12px"
        }}>{sortDesc ? "Newest" : "Oldest"}</button>
      </div>

      {filtered.length === 0 && (
        <div style={{ color: C.faint, textAlign: "center", padding: "48px 0" }}>
          No transactions yet.
        </div>
      )}

      <div style={{ display: "flex", flexDirection: "column", gap: "8px" }}>
        {filtered.map(r => (
          <div key={r.id} style={{
            background: C.card, borderRadius: "14px", padding: "16px"
          }}>
            <div style={{
              display: "flex", justifyContent: "space-between",
              alignItems: "center", gap: "8px", marginBottom: "8px"
            }}>
              <div>
                <span style={{
                  background: TYPES[r.type].color + "22",
                  color: TYPES[r.type].color, fontSize: "10px",
                  fontWeight: 700, textTransform: "uppercase",
                  padding: "4px 8px", borderRadius: "999px"
                }}>{TYPES[r.type].label}</span>
                <span style={{
                  color: C.faint, fontSize: "12px", marginLeft: "8px"
                }}>{fmtDate(r.date)}</span>
              </div>
              <div style={{ display: "flex", gap: "10px" }}>
                <button onClick={() => onEdit(r)} style={{
                  background: "none", border: "none", color: C.sub
                }}>Edit</button>
                <button onClick={() => onDelete(r.id)} style={{
                  background: "none", border: "none", color: C.neg
                }}>Delete</button>
              </div>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between" }}>
              <div>
                <div style={{ color: C.sub, fontSize: "11px" }}>Amount</div>
                <div style={{ fontWeight: 700 }}>{fmtINR(r.amount)}</div>
              </div>
              <div style={{ textAlign: "right" }}>
                <div style={{ color: C.sub, fontSize: "11px" }}>Cash Flow</div>
                <div style={{ color: TYPES[r.type].color, fontWeight: 700 }}>
                  {fmtINR(r.cf)}
                </div>
              </div>
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}
function SettingsView({
  hurdleRate, setHurdleRate, onUpdateValuation, onReset,
  currentValuation, valuationDate, userEmail
}) {
  const [rateInput, setRateInput] = useState((hurdleRate * 100).toFixed(2));
  const [valInput, setValInput] = useState("");
  const [valDate, setValDate] = useState(todayStr());
  const [saved, setSaved] = useState(false);
  const [error, setError] = useState("");

  useEffect(() => {
    setRateInput((hurdleRate * 100).toFixed(2));
  }, [hurdleRate]);

  const saveRate = async () => {
    const value = Number(rateInput);
    if (rateInput.trim() === "" || !Number.isFinite(value) ||
        value < 0 || value > 100) {
      setError("Enter a hurdle rate between 0% and 100%.");
      return;
    }
    setError("");
    await setHurdleRate(value / 100);
  };

  const saveValuation = async () => {
    const value = Number(valInput);
    if (valInput.trim() === "" || !Number.isFinite(value) ||
        value < 0 || !isValidDate(valDate)) {
      setError("Enter a valid valuation and date.");
      return;
    }

    setError("");
    await onUpdateValuation(value, valDate);
    setValInput("");
    setSaved(true);
    setTimeout(() => setSaved(false), 1500);
  };

  return (
    <div style={{ padding: "32px 20px 0" }}>
      <div style={{
        fontFamily: "'Sora',sans-serif", fontSize: "24px",
        fontWeight: 800, marginBottom: "4px"
      }}>Settings</div>
      <div style={{ color: C.faint, fontSize: "12px", marginBottom: "20px" }}>
        {userEmail}
      </div>

      <div style={{
        background: C.card, borderRadius: "16px",
        padding: "16px", marginBottom: "20px"
      }}>
        <div style={{
          color: C.sub, fontSize: "12px", fontWeight: 600,
          textTransform: "uppercase", marginBottom: "8px"
        }}>Hurdle Rate</div>

        <div style={{ display: "flex", alignItems: "center", gap: "8px" }}>
          <input
            type="number" min="0" max="100" step="0.1"
            value={rateInput}
            onChange={e => setRateInput(e.target.value)}
            style={{ ...inputStyle, marginBottom: 0, flex: 1 }}
          />
          <span style={{ color: C.sub, fontSize: "18px", fontWeight: 700 }}>%</span>
        </div>
        <button onClick={saveRate} style={primaryButton}>Save Hurdle Rate</button>
      </div>

      <div style={{
        background: C.card, borderRadius: "16px",
        padding: "16px", marginBottom: "20px"
      }}>
        <div style={{
          color: C.sub, fontSize: "12px", fontWeight: 600,
          textTransform: "uppercase", marginBottom: "8px"
        }}>Update Current Valuation</div>

        <div style={{
          color: C.faint, fontSize: "12px", marginBottom: "12px"
        }}>
          Latest known: {fmtINR(currentValuation)}
          {valuationDate ? ` as of ${fmtDate(valuationDate)}` : " — no valuation recorded"}
        </div>

        <input
          type="number" min="0" step="0.01"
          placeholder="Broker account valuation"
          value={valInput}
          onChange={e => setValInput(e.target.value)}
          style={inputStyle}
        />

        <input
          type="date" value={valDate}
          onChange={e => setValDate(e.target.value)}
          style={{ ...inputStyle, marginTop: "8px" }}
        />

        <button onClick={saveValuation} style={primaryButton}>
          {saved ? "Saved" : "Save Valuation"}
        </button>
      </div>

      {error && (
        <div style={{ color: C.neg, fontSize: "13px", marginBottom: "12px" }}>
          {error}
        </div>
      )}

      <button onClick={onReset} style={{
        color: C.neg, border: `1px solid ${C.neg}66`,
        background: "none", borderRadius: "8px", padding: "12px",
        width: "100%", fontWeight: 600, fontSize: "14px",
        marginBottom: "12px"
      }}>Clear All Data</button>

      <button onClick={() => signOut(auth)} style={{
        color: C.sub, border: `1px solid ${C.divider}`,
        background: "none", borderRadius: "8px", padding: "12px",
        width: "100%", fontWeight: 600, fontSize: "14px"
      }}>Log Out</button>
    </div>
  );
}

function TransactionModal({ initial, onSave, onClose, onDelete }) {
  const [date, setDate] = useState(initial?.date || todayStr());
  const [type, setType] = useState(
    initial?.type && initial.type !== "valuation"
      ? initial.type : "investment"
  );
  const [amount, setAmount] = useState(
    initial?.amount && initial.type !== "valuation"
      ? String(initial.amount) : ""
  );
  const [err, setErr] = useState("");

  const submit = () => {
    const amt = Number(amount);

    if (!isValidDate(date)) {
      setErr("Please select a valid transaction date.");
      return;
    }

    if (!Object.prototype.hasOwnProperty.call(TYPES, type)) {
      setErr("Please select a valid transaction type.");
      return;
    }

    if (amount.trim() === "" || !Number.isFinite(amt) || amt <= 0) {
      setErr("Transaction amount must be greater than zero.");
      return;
    }

    onSave({
      id: initial?.id,
      date,
      type,
      amount: amt,
      valuation: null
    });
  };

  return (
    <div
      onClick={onClose}
      style={{
        position: "fixed", inset: 0, zIndex: 50,
        display: "flex", alignItems: "flex-end", justifyContent: "center",
        background: "#000000aa"
      }}
    >
      <div
        onClick={e => e.stopPropagation()}
        style={{
          background: C.card, borderTopLeftRadius: "24px",
          borderTopRightRadius: "24px", width: "100%",
          maxWidth: "480px", padding: "20px", paddingBottom: "32px",
          maxHeight: "90vh", overflowY: "auto"
        }}
      >
        <div style={{
          display: "flex", justifyContent: "space-between",
          alignItems: "center", marginBottom: "20px"
        }}>
          <div style={{
            fontFamily: "'Sora',sans-serif", fontSize: "18px",
            fontWeight: 700
          }}>{initial ? "Edit Transaction" : "Add Transaction"}</div>

          <button onClick={onClose} style={{
            background: "none", border: "none",
            color: C.sub, fontSize: "24px"
          }}>×</button>
        </div>

        <Label>Date</Label>
        <input
          type="date" value={date}
          onChange={e => setDate(e.target.value)}
          style={inputStyle}
        />

        <Label>Type</Label>
        <div style={{
          display: "flex", gap: "8px", marginBottom: "16px"
        }}>
          {Object.entries(TYPES).map(([key, t]) => (
            <button
              key={key} onClick={() => setType(key)}
              style={{
                background: type === key ? t.color : C.cardAlt,
                color: type === key ? C.bg : C.sub,
                border: `1px solid ${type === key ? t.color : C.divider}`,
                borderRadius: "8px", padding: "10px 6px",
                flex: 1, fontWeight: 700, fontSize: "12px"
              }}
            >{t.label}</button>
          ))}
        </div>

        <Label>Amount</Label>
        <input
          type="number" min="0" step="0.01" inputMode="decimal"
          placeholder="0.00" value={amount}
          onChange={e => setAmount(e.target.value)}
          style={inputStyle}
        />

        {err && (
          <div style={{
            color: C.neg, fontSize: "12px", marginBottom: "12px"
          }}>{err}</div>
        )}

        <button onClick={submit} style={{
          ...primaryButton, padding: "14px", fontSize: "16px"
        }}>Save Transaction</button>

        {onDelete && (
          <button onClick={onDelete} style={{
            background: "none", border: "none", color: C.neg,
            padding: "12px", width: "100%", fontWeight: 600,
            fontSize: "14px", marginTop: "4px"
          }}>Delete Transaction</button>
        )}
      </div>
    </div>
  );
}

function Label({ children }) {
  return (
    <div style={{
      color: C.sub, fontSize: "11px", fontWeight: 700,
      textTransform: "uppercase", letterSpacing: "0.04em",
      marginBottom: "6px"
    }}>{children}</div>
  );
}

function Root() {
  const [user, setUser] = useState(undefined);

  useEffect(() => onAuthStateChanged(auth, setUser), []);

  if (user === undefined) {
    return (
      <div style={{
        background: C.bg, minHeight: "100vh", display: "flex",
        alignItems: "center", justifyContent: "center", color: C.sub
      }}>Loading…</div>
    );
  }

  return user ? <MainApp user={user} /> : <AuthScreen />;
}

createRoot(document.getElementById("root")).render(<Root />);
</script>
</body>
</html>
